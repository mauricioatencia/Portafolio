# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: mauricioatencia/Portafolio
  branch: main
  base_url: https://mauricioatencia.com
  auth_endpoint: api/auth

media_folder: "/public/work"
public_folder: "/work"

collections:
  - name: "settings"
    label: "Configuración"
    files:
      - label: "Categorías"
        name: "categories"
        file: "src/content/categories.json"
        fields:
          - { label: "Título Categoría 1", name: "category_1_title", widget: "string", default: "BRANDING" }
          - { label: "Título Categoría 2", name: "category_2_title", widget: "string", default: "SOCIAL MEDIA" }
          - { label: "Título Categoría 3", name: "category_3_title", widget: "string", default: "FLYERS" }
          - { label: "Título Categoría 4", name: "category_4_title", widget: "string", default: "MERCH" }
          - { label: "Color hover Categoría 1 (Work)", name: "category_1_hover_color", widget: "color", default: "#e26000" }
          - { label: "Color hover Categoría 2 (Work)", name: "category_2_hover_color", widget: "color", default: "#d70016" }
          - { label: "Color hover Categoría 3 (Work)", name: "category_3_hover_color", widget: "color", default: "#b2cdb6" }
          - { label: "Color hover Categoría 4 (Work)", name: "category_4_hover_color", widget: "color", default: "#ab9900" }

      - label: "Ajustes del Sitio (Logo)"
        name: "site_settings"
        file: "src/content/site_settings.json"
        media_folder: "/public/index"
        public_folder: "/index"
        fields:
          - { label: "Texto del Logo", name: "logo_text", widget: "string", default: "Mauricio Atencia" }
          - { label: "Imagen del Logo (Opcional — dejar vacío para usar texto)", name: "logo_image", widget: "file", required: false }
          - { label: "Favicon / Ícono de Pestaña (ICO, PNG, SVG — dejar vacío para usar el predeterminado)", name: "favicon", widget: "file", required: false, hint: "Se muestra en la pestaña del navegador. Recomendado: 32×32 px en formato .ico o .png" }

      - label: "Configuración Ikeneas"
        name: "ikeneas"
        file: "src/content/ikeneas.json"
        fields:
          - { label: "Nombre", name: "name", widget: "string", default: "Ikeneas" }
          - { label: "URL externa", name: "url", widget: "string", default: "https://ikeneas.com/" }
          - { label: "Color hover", name: "hover_color", widget: "color", default: "#6c48b0" }

  - name: "home_collection"
    label: "Inicio (Hero)"
    files:
      - label: "Contenido Home"
        name: "home"
        file: "src/content/home.json"
        fields:
          - label: "Fondo del hero (imagen o video)"
            name: "hero_media"
            widget: "file"
            accept: "image/*,video/mp4,video/webm,video/quicktime"
            hint: "El video se sube a Cloudinary. El póster y la versión optimizada se generan automáticamente."
            media_libraries:
              default: false
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Opacidad capa base", name: "overlay_opacity", widget: "number", value_type: "float" }
          - { label: "Opacidad capa activa", name: "overlay_opacity_active", widget: "number", value_type: "float" }

  - name: "about_collection"
    label: "Sobre mí"
    files:
      - label: "Contenido About"
        name: "about"
        file: "src/content/about.json"
        media_folder: "/public/about"
        public_folder: "/about"
        fields:
          - { label: "Imagen", name: "image", widget: "image" }
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Color de texto", name: "text_color", widget: "color" }
          - { label: "Ubicación", name: "location", widget: "string" }
          - { label: "Párrafos", name: "paragraphs", widget: "text", hint: "Escribe el texto. Usa saltos de línea para separar párrafos." }

  - name: "contact_collection"
    label: "Contacto"
    files:
      - label: "Información de contacto"
        name: "contact"
        file: "src/content/contact.json"
        fields:
          - { label: "Color de fondo", name: "background_color", widget: "color" }
          - { label: "Color de texto", name: "text_color", widget: "color" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "WhatsApp URL", name: "whatsapp_url", widget: "string" }

  - name: "projects_category_1"
    label: "Proyectos Categoría 1"
    folder: "src/content/projects"
    media_folder: "/public/work/branding"
    public_folder: "/work/branding"
    create: true
    filter:
      field: category
      value: "category_1"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_1" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre del proyecto", name: "name", widget: "string" }
      - { label: "Fecha del proyecto", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, hint: "Elige la fecha exacta — el orden de los proyectos se basa en esta fecha (más reciente = primero)." }
      - { label: "Ciudad del proyecto", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Frase corta del proyecto", name: "tagline", widget: "text", required: false }
      - { label: "Tagline del proyecto", name: "services", widget: "string", required: false, hint: "Escribe los servicios separados por coma. Ej: Branding, Naming, Identidad" }
      - label: "Descripción del proyecto"
        name: "sections"
        widget: "list"
        required: false
        collapsed: false
        minimize_collapsed: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - { label: "Párrafos", name: "paragraphs", widget: "text", hint: "Escribe todo el texto aquí. Separa los párrafos con una línea en blanco.", required: false }
      - { label: "Derechos reservados", name: "note", widget: "string", required: false }
      - label: "Cargar medios"
        name: "images"
        widget: "file"
        multiple: true
        required: false
        accept: "image/*,video/mp4,video/webm,video/quicktime"
        hint: "Imágenes: usa Recursos para comprimirlas y guardarlas en el proyecto. Videos: usa Cloudinary; se optimizan y generan póster automáticamente."

  - name: "projects_category_2"
    label: "Proyectos Categoría 2"
    folder: "src/content/projects"
    media_folder: "/public/work/art-direction"
    public_folder: "/work/art-direction"
    create: true
    filter:
      field: category
      value: "category_2"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_2" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre del proyecto", name: "name", widget: "string" }
      - { label: "Fecha del proyecto", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, hint: "Elige la fecha exacta — el orden de los proyectos se basa en esta fecha (más reciente = primero)." }
      - { label: "Ciudad del proyecto", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Frase corta del proyecto", name: "tagline", widget: "text", required: false }
      - { label: "Tagline del proyecto", name: "services", widget: "string", required: false, hint: "Escribe los servicios separados por coma. Ej: Branding, Naming, Identidad" }
      - label: "Descripción del proyecto"
        name: "sections"
        widget: "list"
        required: false
        collapsed: false
        minimize_collapsed: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - { label: "Párrafos", name: "paragraphs", widget: "text", hint: "Escribe todo el texto aquí. Separa los párrafos con una línea en blanco.", required: false }
      - { label: "Derechos reservados", name: "note", widget: "string", required: false }
      - label: "Cargar medios"
        name: "images"
        widget: "file"
        multiple: true
        required: false
        accept: "image/*,video/mp4,video/webm,video/quicktime"
        hint: "Imágenes: usa Recursos para comprimirlas y guardarlas en el proyecto. Videos: usa Cloudinary; se optimizan y generan póster automáticamente."

  - name: "projects_category_3"
    label: "Proyectos Categoría 3"
    folder: "src/content/projects"
    media_folder: "/public/work/merch"
    public_folder: "/work/merch"
    create: true
    filter:
      field: category
      value: "category_3"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_3" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre del proyecto", name: "name", widget: "string" }
      - { label: "Fecha del proyecto", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, hint: "Elige la fecha exacta — el orden de los proyectos se basa en esta fecha (más reciente = primero)." }
      - { label: "Ciudad del proyecto", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Frase corta del proyecto", name: "tagline", widget: "text", required: false }
      - { label: "Tagline del proyecto", name: "services", widget: "string", required: false, hint: "Escribe los servicios separados por coma. Ej: Branding, Naming, Identidad" }
      - label: "Descripción del proyecto"
        name: "sections"
        widget: "list"
        required: false
        collapsed: false
        minimize_collapsed: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - { label: "Párrafos", name: "paragraphs", widget: "text", hint: "Escribe todo el texto aquí. Separa los párrafos con una línea en blanco.", required: false }
      - { label: "Derechos reservados", name: "note", widget: "string", required: false }
      - label: "Cargar medios"
        name: "images"
        widget: "file"
        multiple: true
        required: false
        accept: "image/*,video/mp4,video/webm,video/quicktime"
        hint: "Imágenes: usa Recursos para comprimirlas y guardarlas en el proyecto. Videos: usa Cloudinary; se optimizan y generan póster automáticamente."

  - name: "projects_category_4"
    label: "Proyectos Categoría 4"
    folder: "src/content/projects"
    media_folder: "/public/work/hybrid"
    public_folder: "/work/hybrid"
    create: true
    filter:
      field: category
      value: "category_4"
    extension: "json"
    format: "json"
    identifier_field: "name"
    slug: "{{slug}}"
    fields:
      - { label: "Categoría", name: "category", widget: "select", options: ["category_1", "category_2", "category_3", "category_4"], default: "category_4" }
      - { label: "ID (automático)", name: "id", widget: "hidden", default: "" }
      - { label: "Nombre del proyecto", name: "name", widget: "string" }
      - { label: "Fecha del proyecto", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, hint: "Elige la fecha exacta — el orden de los proyectos se basa en esta fecha (más reciente = primero)." }
      - { label: "Ciudad del proyecto", name: "location", widget: "string" }
      - { label: "Color", name: "color", widget: "color" }
      - { label: "Frase corta del proyecto", name: "tagline", widget: "text", required: false }
      - { label: "Tagline del proyecto", name: "services", widget: "string", required: false, hint: "Escribe los servicios separados por coma. Ej: Branding, Naming, Identidad" }
      - label: "Descripción del proyecto"
        name: "sections"
        widget: "list"
        required: false
        collapsed: false
        minimize_collapsed: false
        fields:
          - { label: "Título", name: "label", widget: "string" }
          - { label: "Párrafos", name: "paragraphs", widget: "text", hint: "Escribe todo el texto aquí. Separa los párrafos con una línea en blanco.", required: false }
      - { label: "Derechos reservados", name: "note", widget: "string", required: false }
      - label: "Cargar medios"
        name: "images"
        widget: "file"
        multiple: true
        required: false
        accept: "image/*,video/mp4,video/webm,video/quicktime"
        hint: "Imágenes: usa Recursos para comprimirlas y guardarlas en el proyecto. Videos: usa Cloudinary; se optimizan y generan póster automáticamente."
